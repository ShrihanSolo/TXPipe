global:
    chunk_rows: 100000
    pixelization: healpix
    sparse: true

TXMeanShearSurveyProperties:
    nbins: 20
    min_count: 50
    outlier_fraction: 0.05
    delta_gamma: 0.02      # same as the calibration stage in both DP2 configs
    # Empty list: test every map in psf_maps. To pick some, list their names,
    # e.g. ["psf/g1_2D", "psf/T_2D"].
    properties: []
    # DP2 survey property maps (nside 4096), made from the DP2 butler repo at
    # NERSC by dp2_run/convert_dp2_sp_maps.py. If the directory does not exist
    # yet, the stage just tests the PSF maps; "" also means no .hs maps.
    external_maps_dir: /pscratch/sd/s/shrihan/dp2_survey_property_maps
    bands: [i]
    map_plot_nside: 256
    projection: McBryde
